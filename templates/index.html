<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot OpenRouter</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h4 mb-0">Chatbot OpenRouter</h1>
                    </div>
                    
                    <div class="card-body p-4">
                        <form method="POST" action="/">
                            <div class="mb-3">
                                <label for="pergunta" class="form-label fw-bold">Sua Pergunta:</label>
                                <textarea 
                                    class="form-control" 
                                    id="pergunta" 
                                    name="pergunta" 
                                    rows="3" 
                                    placeholder="Digite sua pergunta aqui..." 
                                    required>{{ pergunta }}</textarea>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Pergunta</button>
                            </div>
                        </form>

                        {% if resposta %}
                        <div class="mt-4">
                            <label class="form-label fw-bold">Resposta:</label>
                            <div class="p-3 bg-white border rounded shadow-sm" style="white-space: pre-wrap;">{{ resposta }}</div>
                        </div>
                        {% endif %}
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
