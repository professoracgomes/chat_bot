<!DOCTYPE html>
<html>
<head>
    <title>Chatbot IA</title>
</head>
<body>

    <h1>Chatbot com Flask</h1>

    <form method="post">

        <input
            type="text"
            name="pergunta"
            placeholder="Digite sua pergunta"
            size="50">

        <button type="submit">
            Enviar
        </button>

    </form>

    <hr>

    <h3>Resposta:</h3>

    <p>{{ resposta }}</p>

</body>
</html>
